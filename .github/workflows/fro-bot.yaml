---
name: Fro Bot

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  discussion_comment:
    types: [created]
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, review_requested]
  schedule:
    # Staggered off other portfolio repos to spread rate-limit load.
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Operation mode
        type: choice
        options:
          - review
          - autoheal
        default: autoheal
      prompt:
        description: Custom prompt for review mode
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: >-
    fro-bot-${{
      github.event.issue.number ||
      github.event.pull_request.number ||
      github.event.discussion.number ||
      (github.event_name == 'schedule' && 'scheduled-maintenance') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'autoheal' && 'scheduled-maintenance') ||
      github.run_id
    }}
  cancel-in-progress: false

env:
  PR_REVIEW_PROMPT: |
    You are reviewing a pull request for Token Toilet — a Web3 DeFi
    application built with Next.js 16 + React 19 + TypeScript 6 + Wagmi v2
    + Reown AppKit + Tailwind CSS v4 + Vitest + Storybook, deployed to Vercel.
    Read AGENTS.md for full project conventions before reviewing.

    Do the review directly yourself using the rubric below. Do NOT invoke
    the `ce:review` skill or any other multi-agent Systematic review
    workflow — they spawn parallel persona subagents that are too slow and
    too costly for per-PR CI. A single-pass review against this rubric is
    the required approach here.

    Focus your review on:

    1. CORRECTNESS & EDGE CASES
       - Logic errors, off-by-one, null/undefined paths
       - Async race conditions, especially in wallet operations
       - React hook dependency arrays and stale closures
       - Functional state updates in useEffect (`setX(prev => ...)` not `setX(x + 1)`)
       - Ref capture at effect execution time for cleanup
       - Workflow gating (if: conditions, needs: chains, the skipped-needs
         trap — finalize jobs that depend on conditional prepare jobs MUST
         use !cancelled() to bypass the implicit success() guard)
       - Silent failure paths: continue-on-error: true on local deterministic
         steps is a red flag (use it only for external-API fetches with
         clear fallback behavior)

    2. WEB3 SECURITY (elevated scrutiny)
       - Token approval flows: infinite approvals flagged, amount validation
       - Address handling: checksummed, validated before use
       - Transaction error handling: try/catch with console.error, never throw
         on connect/disconnect
       - Wallet state transitions: connected → disconnecting → disconnected
       - Chain ID validation and unsupported network handling
       - Reentrancy concerns in any contract interaction patterns
       - Private key / mnemonic exposure: never logged, displayed, or stored
       - RPC endpoint safety: no hardcoded private keys in config

    3. ARCHITECTURE & PATTERNS
       - Must use `useWallet` hook, not direct wagmi/AppKit hooks in components
       - Web3 components require `'use client'` directive
       - Imports use `@/*` path alias
       - Design system components from `@/components/ui/*`
       - Environment access via `import {env} from '@/env'`, never `process.env`

    4. TYPE SAFETY (strict — no exceptions)
       - No `as any`, `@ts-ignore`, or `@ts-expect-error`
       - Discriminated unions over optional properties
       - Parse, don't validate (Zod-first for runtime validation)
       - Explicit return types on public APIs

    5. STYLING (Tailwind CSS v4 — CSS-first)
       - No `tailwind.config.ts` or JavaScript-based theme config
       - No `@apply` directives
       - CSS custom properties in `@theme` blocks for design tokens
       - Violet branding (`--color-violet-*`) and glass morphism patterns
       - No hardcoded color values — use design system tokens

    6. TESTING
       - New/changed behavior must have test coverage
       - Web3 components require mocked wallet providers (wagmi, AppKit)
       - Use computed property names for hook mocks (avoids ESLint warnings)
       - Co-located test files: `component.test.ts(x)` alongside source

    7. BREAKING CHANGES
       - Changes to public hook APIs (useWallet, useTokenApproval)
       - Design system component prop changes
       - Web3 config changes affecting supported chains

    Do NOT push commits, modify code, or create branches. Review only.
    Use inline comments for file-specific issues. Reserve the review body
    for the structured summary below.

    You MUST structure your review using exactly these headings:
    ## Verdict: [PASS | CONDITIONAL | REJECT]
    CONDITIONAL = can merge after addressing the listed blocking issues.
    ### Blocking issues
    ### Non-blocking concerns
    ### Web3 security assessment
    ### Missing tests
    ### Risk assessment (LOW/MED/HIGH) + rationale
    Evaluate likelihood of regression, security exposure, or blast radius.
    If a section has no items, write "None" under the heading.
    Do not omit any heading.

  SCHEDULE_PROMPT: |
    Perform the daily Fro Bot pass for Token Toilet — a Web3 DeFi
    application built with Next.js 16 + React 19 + TypeScript 6 + Wagmi v2
    + Reown AppKit + Tailwind CSS v4 + Vitest + Storybook, deployed to Vercel.
    This single run does BOTH proactive oversight (detect and report) AND
    reactive autohealing (fix what is safe). Read AGENTS.md for full project
    conventions before making changes.

    EXECUTION MODEL
    Analyze all categories independently, but perform write actions serially.
    Do not keep multiple branches checked out at once. Complete one mutation,
    return to a clean working tree, then continue.

    DEDUPLICATION (applies to ALL categories)
    Before creating any new PR or issue, search for an existing open
    bot-authored PR/issue for the same root cause. Reuse or update the
    existing item instead of creating a duplicate.

    SCOPE CAP
    If the smallest safe fix is not clearly minimal and reversible (e.g.,
    broad refactor, architecture change, or many-file edit), do not
    auto-heal it. Open or update an issue and record it under "Tasks for
    Agents" with enough detail for any agent to act on cold. Deferring a
    task grants it no additional authority: it still requires any approval
    or trust check it would have needed if attempted now. Deferring must
    never become a way to launder scope past the checks in this prompt.

    DEPENDENCY OWNERSHIP
    Renovate owns routine dependency/version bumps (configured via
    marcusrbrown/renovate-config preset with bfra-me automerge rules).
    You may change dependency versions only when remediating a confirmed
    security advisory (critical/high) or repairing an existing
    security-update PR. Do not create non-security version-bump PRs, and
    do not batch unrelated dependency changes into a security fix. Do NOT
    modify package.json versions outside category 2 security remediation.

    TRUSTED AUTHORS
    Trusted PR authors for branch repair are Marcus and these automation bots:
    - renovate[bot]
    - dependabot[bot]
    - mrbro-bot[bot]
    - fro-bot

    1. ERRORED PRs — REMEDIATION-CAPABLE
       Find open PRs with failing CI checks. Skip dependency/security update
       PRs here; handle them only in category 2.
       Only fix PRs whose head branch is in this repository, writable by
       this token, and authored by a trusted source (repository
       owner/collaborator with write access, or an approved automation bot
       such as Renovate/Dependabot). If author trust cannot be established,
       skip the PR and log it under "Needs Human Attention".
       If the PR touches workflows, automation prompts, package-manager
       config, lockfiles, or execution scripts, do not run project commands
       from that branch. Skip it and log why.
       For each fixable PR:
       a. Check out the PR branch.
       b. Read the failing check logs to diagnose the root cause.
       c. Fix the issue (type errors, lint failures, test regressions,
          build breaks).
       d. Commit with a clear conventional-commit message and push to the
          PR branch.
       e. Comment on the PR explaining what failed and what was fixed.
       f. Never modify .github/workflows/ or this prompt while repairing
          an errored PR. If the failing run appears caused by the Fro Bot
          workflow, skip the PR and log it under "Needs Human Attention".

    2. SECURITY — REMEDIATION-CAPABLE
       Review Dependabot/Renovate alerts and open PRs for vulnerable deps.
       - If a security update PR exists but has conflicts or failures,
         fix and push to that PR branch.
       - For unaddressed critical/high advisories with no existing PR,
         create a new PR with the remediation.
       - Do NOT bulk-update unrelated deps in a security PR.
       If security advisory/alert data is unavailable to the token or CLI,
       skip this category and note "security alerts unavailable" under
       "Needs Human Attention". Do not guess.

       Web3-specific security checks:
       - Verify no private keys, mnemonics, or wallet secrets appear in
         source code, config, or committed .env files.
       - Check that RPC endpoint URLs do not contain embedded API keys in
         committed source (should use env vars).
       - Flag any direct usage of `eval()` or `Function()` constructors
         near user-supplied data.
       - Verify that `.env.example` or `.env.local.example` files do not
         contain real values, only placeholder templates.

    3. CODE QUALITY & REPO HYGIENE — REPORT-ONLY
       This category is primarily report-only. Focus on things only a
       code-aware agent can catch:
       - Run `pnpm build` (Next.js production build). Report any type
         errors or build failures.
       - Run `pnpm test:coverage` and report coverage metrics. If coverage
         regressions are detected, open or update a single issue with the
         failing metrics and the top contributing files.
       - Run `pnpm run build-storybook` and report any failures. Storybook
         health is critical for design system documentation.
       - Run `pnpm run validate:design-system` to verify design system
         completeness. Report any validation failures.
       - Run `pnpm run validate:web3` to verify Web3 integration patterns.
         Report any validation failures.
       - Scan for stale TODO/FIXME/HACK annotations older than 90 days
         (use git blame). Collect them into a single issue or update an
         existing "Stale TODOs" issue.
       - Workflow health: check the last 7 days of runs for each workflow.
         Flag any workflow where >50% of expected runs failed, or where
         scheduled runs produced zero successful auto-generated commits
         when they should have. (Caught a 1.5-year silent outage in
         marcusrbrown/marcusrbrown in May 2026; we want it caught fast
         in this repo too.)
       - Configuration freshness: flag any pinned contract addresses, RPC
         endpoint URLs, or chain config entries that haven't been verified
         against the upstream registry in 90+ days (use git blame). Flag
         deprecated SDK methods imported but not yet migrated (e.g.,
         Wagmi/AppKit APIs marked deprecated in release notes). Report
         findings — do not auto-fix configuration values.
       - Verify convention compliance:
         * No `as any`, `@ts-ignore`, or `@ts-expect-error` in source
         * No direct wagmi/AppKit hook usage outside `hooks/` directory
           (components must use `useWallet`, not `useAccount` directly)
         * Imports use `@/` alias for project paths
         * Web3 components have `'use client'` directive
         * No `process.env` usage (must use `import {env} from '@/env'`)
         * No `tailwind.config.ts` or `@apply` directives
         * No hardcoded color values (must use design system tokens)
         * Error handling: try/catch with console.error on Web3 ops,
           never throw on connect/disconnect
         * Functional state updates in useEffect
       Report findings but put actual code fixes into category 4.

       - Check that AGENTS.md accurately reflects the current directory
         structure and project conventions. If drift is found, open an
         issue (not a PR) describing the drift.

    4. DEVELOPER EXPERIENCE — REMEDIATION-CAPABLE
       Ensure consistent linting, formatting, and static analysis.
       Run `pnpm lint`; fix any failures, including convention violations
       found in category 3.
       Open a PR for all fixes — never commit directly to the default
       branch. Group related lint/format/convention fixes into a single PR.
       Use a clear conventional-commit title like
       `chore(lint): apply auto-fixes from autohealing run`.

    5. QUALITY GATES VERIFICATION — REPORT + DELEGATES FIXES TO CATEGORY 4
       Verify the project's quality gates pass on the default branch:
       a. `pnpm lint` — 0 errors
       b. `pnpm exec tsc --noEmit` — type check passes
       c. `pnpm test` — all unit tests passing
       d. `pnpm build` — successful Next.js production build
       e. `pnpm run build-storybook` — Storybook builds successfully
       f. `pnpm audit --audit-level moderate` — no moderate+ vulnerabilities
       g. `pnpm run validate:design-system` — design system complete
       h. `pnpm run validate:web3` — Web3 patterns valid

       For each failing gate:
       - Identify the root cause from command output.
       - If the fix is minimal and safe, include it in a category 4 PR.
       - If the fix is complex, open an issue with diagnosis and
         recommended approach.

    6. CROSS-PROJECT INTELLIGENCE (INBOUND ONLY) — REPORT-ONLY
       Survey Marcus's other repos for patterns, tooling, and conventions
       that could improve THIS repo. The goal is inbound intelligence —
       what can we learn from the portfolio to make Token Toilet better?

       Use `gh` CLI for all queries. Observation only — never modify
       other repos.

       Focus repos (check these every run; the list should evolve over
       time — drop repos that consistently have nothing actionable, add
       repos that become relevant):
       - `marcusrbrown/yield-farmer` — DeFi/yield strategy patterns, Fro Bot
         prompt evolution, Web3 safety checks, single-issue autohealing
       - `marcusrbrown/poly` — capability-ABC layering, Python cost patterns
         applicable to TypeScript, CI safety practices
       - `marcusrbrown/renovate-config` — dependency governance patterns
       - `marcusrbrown/.github` — shared repository conventions, org-level
         workflows and templates
       - `fro-bot/agent` — Fro Bot/OpenCode runtime capabilities and
         release notes

       For each focus repo, check:
       a. Fro Bot version: compare `fro-bot/agent@` SHA if present.
       b. CI patterns: any workflow improvements we could adopt?
       c. Renovate config: any preset evolution worth adopting?
       d. Tooling patterns: any build/test/CI tools we don't use?
       e. New dependencies or conventions worth evaluating.

       Keep findings actionable and specific to Token Toilet. Skip repos
       with nothing notable. Adapt foreign-stack findings (Python, Bun/TS)
       only when there's a clear Next.js/TypeScript equivalent.

       Hard boundaries:
       - NEVER modify other repositories. Observation only.
       - NEVER open PRs, issues, or comments in other repositories.
       - NEVER clone or check out other repositories.
       - All findings go into the daily report issue in THIS repository
         only.
       - If a `gh` query fails for a repo, skip it and note why.

    7. UPSTREAM MODERNIZATION WATCH (SUNDAYS UTC ONLY) — REPORT-ONLY
       On Sundays UTC, review release notes for pinned upstreams:
       - `fro-bot/agent` used by .github/workflows/fro-bot.yaml
       - `actions/checkout` used by .github/workflows/fro-bot.yaml
       - `Next.js`, `React`, `Wagmi`, `Reown AppKit`, `Tailwind CSS`
         — watch for major/breaking changes only
       - OpenCode/Fro Bot runtime docs relevant to opencode run, HTTP
         mode, configured tools, skills, agents, hooks, and durable
         session state

       Identify new hardening or observability features worth adopting.
       Do not bump versions or modify workflows in this category. Document
       findings in the daily report.

       Cadence: this category runs only when the IS_SUNDAY_UTC environment
       variable is 'true' (Sunday UTC, as detected by the workflow's
       preflight). Before doing any category 7 work, read this variable.
       On other days, skip entirely and omit the corresponding section
       from the daily report.

    AGENT NOTES (instead of per-agent follow-up tasks)
    Do NOT create follow-up tasks addressed to a specific agent (no "for Fro
    Bot", "for Copilot", or similar items). When work is deferred, write the
    note so any LLM agent can pick it up cold: the exact file paths, the root
    cause, the smallest safe fix, any constraints or "do not retry" warnings,
    and how to verify. Collect all deferred, actionable work in the "Tasks
    for Agents" section of the daily report — do not split it into
    per-agent subsections.

    OUTPUT — DAILY ROTATING REPORT ISSUE
    Freeze one UTC date at the start of this run ("today's date") and use
    that same value for every title, comparison, and body section for the
    rest of the run, even if the run straddles midnight UTC.

    An issue is an ELIGIBLE REPORT only if ALL of the following hold:
    - it exists in this repository (never adopt or close issues in other
      repositories),
    - it is an issue, not a pull request,
    - it was authored by this workflow's own reporting identity (the
      `fro-bot` account backing FRO_BOT_PAT) — never adopt or close an
      issue authored by anyone else, bot or human, even if the title
      matches,
    - its title exactly matches either the dated grammar
      "Daily Autohealing Report — YYYY-MM-DD (UTC)" for some date, or is
      exactly the legacy undated title "Daily Autohealing Report" (the
      only enumerated special case). A prefix match is NOT sufficient: a
      bot-authored issue titled "Daily Autohealing Report loses deferred
      tasks" is not an eligible report, because this workflow can also
      open diagnostic issues with similar-looking titles.

    If an issue's identity or provenance is uncertain — authorship cannot
    be confirmed, or a title collision cannot be resolved with confidence
    (for example a human-filed issue that happens to use the exact dated
    title) — leave it untouched: do not adopt it as canonical and do not
    close it. Report the conflict under "Needs Human Attention" instead.

    Precedence: authorization wins over the "exactly one open" goal below.
    Only reconcile eligible reports. Never broaden eligibility — treating a
    non-matching title or a non-`fro-bot` author as close enough — just to
    force the count to one. Leaving an ambiguous or foreign-owned issue
    open is the correct outcome, not a bug.

    Follow this order deterministically so the run is idempotent even if it
    overlaps another run:
    1. Enumerate ALL eligible reports by paginating the full open-issues
       listing to the end. GitHub issue listings paginate; a partial page
       cannot establish that no report exists or that every duplicate was
       found.
    2. Among eligible reports whose title exactly matches today's frozen
       dated title, pick the LOWEST issue number as canonical and reuse it
       (edit its body in place). If none exist, create a new issue with
       today's exact dated title.
    3. Write the canonical body, then verify the write was actually
       published (re-read the issue and confirm the body committed) before
       doing anything else. If publication cannot be verified, STOP: close
       nothing this run, leave every other eligible report intact, and log
       the failure under "Needs Human Attention". A failed run must never
       destroy the only surviving report.
    4. Only after verified publication, close every OTHER eligible report
       — older dates, same-day duplicates that are not the canonical one,
       and the legacy undated title — each with a one-line closing comment
       linking the canonical report (the sole exception to the
       no-issue-comments rule below). Never close a report dated LATER
       than today's frozen date: a run straddling midnight, or a delayed
       previous-day run, must not retire a newer report than itself. Never
       close the canonical issue you just selected.

    There must be exactly one open daily report when the run finishes,
    UNLESS step 3 halted the run for an unverified publication or steps
    1-2 left an ambiguous/foreign-owned issue open per the precedence rule
    above — both are correct outcomes, not violations of this goal.

    The report REPLACES the previous body each day — do not prepend or
    archive old sections. Name the previous report's issue number near the
    top of the new body: the issue number this run closed as predecessor,
    or — on a same-day rerun that closes nothing because the canonical
    issue already existed — preserve whatever predecessor reference is
    already present in that issue's current body rather than overwriting
    it with "None". Write "None" only when there is genuinely no known
    predecessor.

    The issue body MUST use this structure (write "None" for empty sections
    and do not emit empty tables — write "None" directly under the heading
    instead). Omit the Upstream Modernization Watch section entirely on
    non-Sundays:

    ## Daily Autohealing Report — YYYY-MM-DD (UTC)

    **Previous report:** #N (or None)

    ### Run Summary
    | Category | Status | Notes |
    | --- | --- | --- |
    | Errored PRs | ✅/⚠️/❌ | ... |
    | Security | ✅/⚠️/❌ | ... |
    | Code Quality & Repo Hygiene | ✅/⚠️/❌ | ... |
    | Developer Experience | ✅/⚠️/❌ | ... |
    | Quality Gates | ✅/⚠️/❌ | ... |
    | Cross-Project Intelligence | ✅/⚠️/❌ | ... |
    | Upstream Modernization Watch | ✅/⚠️/❌ | ... |

    ### Errored PRs
    | PR | Failure | Fix | Status |
    | --- | --- | --- | --- |
    | #N | [root cause] | [what was fixed] | ✅ Fixed / ⚠️ Needs review / ⏭️ Skipped |

    ### Security
    | Advisory / PR | Severity | Action Taken |
    | --- | --- | --- |
    | [advisory or #N] | Critical/High/Medium | [fix pushed / PR created / skipped / unavailable] |

    ### Code Quality & Repo Hygiene
    | Check | Result | Action |
    | --- | --- | --- |
    | Next.js build | ✅ Pass / ❌ Fail | [details or #N] |
    | Test coverage | ✅ Meets thresholds / ⚠️ Below target | [details or #N] |
    | Storybook build | ✅ Pass / ❌ Fail | [details or #N] |
    | Design system | ✅ Valid / ⚠️ Issues | [details or #N] |
    | Web3 patterns | ✅ Valid / ⚠️ Issues | [details or #N] |
    | Stale TODOs | N found | [#N or None] |
    | Convention drift | ✅ Clean / ⚠️ Issues | [details or #N] |
    | AGENTS.md accuracy | ✅ Current / ⚠️ Drifted | [#N or None] |

    ### Developer Experience
    - [list of each PR or commit-sized fix with summary link]

    ### Quality Gates
    | Gate | Status | Details |
    | --- | --- | --- |
    | Lint | ✅ / ❌ | [error count or clean] |
    | Type check | ✅ / ❌ | [error count or clean] |
    | Unit tests | ✅ / ❌ | [pass/fail count] |
    | Build | ✅ / ❌ | [details] |
    | Storybook | ✅ / ❌ | [details] |
    | Security audit | ✅ / ❌ | [advisory count] |
    | Design system | ✅ / ❌ | [details] |
    | Web3 validation | ✅ / ❌ | [details] |

    ### Cross-Project Intelligence (Inbound)
    | Repo | Finding | Actionable for Token Toilet? | Priority |
    | --- | --- | --- | --- |
    | [repo] | [what they do that we don't] | [specific action or monitor] | High/Med/Low |

    ### Upstream Modernization Watch
    [Sunday-only section. On Sundays UTC, include findings or write "Scan
    clean" if no actionable items. On other days, omit this entire section
    from the daily report.]

    ### Tasks for Agents
    [Actionable-but-deferred work only, written so any agent can pick it up
    cold: exact file paths, root cause, smallest safe fix, any constraints
    or "do not retry" warnings, and how to verify. No per-agent ownership —
    never address an item "for Fro Bot" or "for Copilot".]

    ### Needs Human Attention
    [Blocked, ambiguous, or security-sensitive items that require a human
    decision.]

    Hard boundaries:
    - Never edit Marcus's first-person content (README intro, blog posts,
      marketing copy, any user-facing language). Report stale claims;
      don't rewrite them.
    - Never force-push, rewrite history, or delete branches.
    - Never push directly to the default branch. Direct pushes are allowed
      only to an existing non-default PR branch you are repairing under
      category 1 or category 2.
    - Never merge PRs, submit reviews/approvals, or modify branch
      protection. The only exception to never closing an issue is closing
      superseded "Daily Autohealing Report" issues it authored, exactly as
      described in the OUTPUT section rotation above — never close or
      reopen any other issue, and never close, reopen, or approve any PR.
      This workflow may only push fixes, open/update PRs, open/update
      issues, close superseded daily-report issues it authored, and
      comment on PRs when a fix was pushed.
    - Never modify secrets, org settings, environments, or branch
      protection.
    - DO NOT comment on individual issues or PRs unless category 1 fixed a
      failing PR (then ONLY post the fix-summary comment on that PR), or
      this run closes a superseded daily-report issue under the OUTPUT
      section above (then ONLY post the one-line retirement comment
      linking the canonical report).
    - Never make checks pass by disabling tests, deleting failing
      assertions, lowering coverage/performance budgets, weakening
      lint/type rules, or editing workflows/configuration only to suppress
      failures.
    - Do not modify .github/workflows/, lint/test/build config, hook
      config, or automation prompt files unless the failing run is caused
      by a genuine bug in that file, the change is narrowly scoped, and
      the summary explains why.
    - If the smallest safe fix would weaken a guardrail or reduce
      validation, skip it and log it under "Needs Human Attention".
    - Cross-project intelligence (category 6) MUST NOT modify other repos.
    - Upstream modernization watch (category 7) MUST NOT bump pinned
      versions (Renovate-owned) or modify upstream repositories.
    - Do not leave more than one open daily report issue; the rotation in
      the OUTPUT section above must always leave exactly one open.

    Project conventions (MUST follow for code changes):
    - TypeScript strict mode: no `any`, no `@ts-ignore`, no `@ts-expect-error`
    - Import alias: `@/` for project paths
    - Web3 hooks: use `useWallet` abstraction, not direct wagmi hooks
    - Error handling: `try/catch` with `console.error`, never throw on
      connect/disconnect
    - Styling: Tailwind CSS v4 CSS-first, no `tailwind.config.ts`, no
      `@apply`, CSS custom properties in `@theme` blocks
    - Package manager: pnpm (not npm/yarn)
    - YAML extension: .yaml, not .yml

jobs:
  fro-bot:
    name: Fro Bot
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      discussions: write
    if: >-
      (
        github.event.pull_request == null ||
        (
          !github.event.pull_request.head.repo.fork &&
          !endsWith(github.event.pull_request.user.login || '', '[bot]')
        )
      ) && (
        (
          github.event_name == 'issues' &&
          !endsWith(github.event.issue.user.login || '', '[bot]') &&
          (github.event.issue.user.login || '') != 'fro-bot' &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association || '')
        ) ||
        (
          github.event_name == 'pull_request' &&
          !endsWith(github.event.pull_request.user.login || '', '[bot]') &&
          (github.event.pull_request.user.login || '') != 'fro-bot'
        ) ||
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (
          (github.event_name == 'issue_comment' ||
           github.event_name == 'pull_request_review_comment' ||
           github.event_name == 'discussion_comment') &&
          contains(github.event.comment.body || '', '@fro-bot') &&
          (github.event.comment.user.login || '') != 'fro-bot' &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || '')
        )
      )
    steps:
      - name: Refuse fork PR heads from comment triggers
        # issue_comment carries no pull_request payload, so the job-level
        # fork guard cannot see comment-triggered PR-head checkouts.
        id: refuse-fork-heads
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ secrets.FRO_BOT_PAT }}
        run: |
          pr_number="${{ github.event.issue.number }}"
          pr_json=$(gh api "repos/${{ github.repository }}/pulls/${pr_number}")
          is_fork=$(printf '%s' "$pr_json" | jq -r '.head.repo.fork // "unknown"')
          if [ "$is_fork" = "true" ]; then
            echo "::error::Refusing to check out fork PR head from comment trigger (PR #${pr_number}, fork=${is_fork})."
            exit 1
          fi
          echo "head-sha=$(printf '%s' "$pr_json" | jq -r '.head.sha')" >> "$GITHUB_OUTPUT"

      - name: Detect Sunday UTC for category 7 cadence
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "$(date -u +%u)" = "7" ]; then
            echo "IS_SUNDAY_UTC=true" >> "$GITHUB_ENV"
          else
            echo "IS_SUNDAY_UTC=false" >> "$GITHUB_ENV"
          fi

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: >-
            ${{
              (github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number))
              || github.event.pull_request.head.sha
              || ''
            }}
          # FRO_BOT_PAT: write on contents/issues/PRs/discussions, this repo only.
          token: ${{ secrets.FRO_BOT_PAT }}
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Enable authenticated git push for autoheal fixes
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'autoheal')
        env:
          FRO_BOT_PAT: ${{ secrets.FRO_BOT_PAT }}
        run: |
          set -euo pipefail
          # Schedule/autoheal only: the agent fails closed on an on-disk
          # extraheader for comment runs. On disk, not env — the action
          # scrubs its child environment.
          auth="$(printf '%s' "x-access-token:${FRO_BOT_PAT}" | base64 | tr -d '\n')"
          echo "::add-mask::${auth}"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"

      - name: Run Fro Bot
        uses: fro-bot/agent@dd5b53439608e481fbbf20382b79d046f1fe9cbe # v0.114.1
        env:
          OPENCODE_PROMPT_ARTIFACT: 'true'
          IS_SUNDAY_UTC: ${{ env.IS_SUNDAY_UTC || 'false' }}
          PROMPT: >-
            ${{
              ((github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'autoheal')) && env.SCHEDULE_PROMPT
              || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'review' && github.event.inputs.prompt)
              || (github.event_name == 'pull_request' && env.PR_REVIEW_PROMPT)
              || ''
            }}
        with:
          auth-json: ${{ secrets.OPENCODE_AUTH_JSON }}
          github-token: ${{ secrets.FRO_BOT_PAT }}
          model: ${{ vars.FRO_BOT_MODEL }}
          omo-providers: ${{ secrets.OMO_PROVIDERS }}
          opencode-config: ${{ secrets.OPENCODE_CONFIG }}
          prompt: ${{ env.PROMPT }}
          timeout: 0
          # Empty on schedule/autoheal; PR head SHA on pull_request/PR-comment events.
          trusted-head-sha: >-
            ${{
              (github.event_name == 'pull_request' && github.event.pull_request.head.sha)
              || (github.event_name == 'pull_request_review_comment' && github.event.pull_request.head.sha)
              || (github.event_name == 'issue_comment' && github.event.issue.pull_request && steps.refuse-fork-heads.outputs.head-sha)
              || ''
            }}
          # Unset defaults to working-dir, which forbids push/PR.
          output-mode: >-
            ${{
              (github.event_name == 'schedule'
                || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'autoheal'))
              && 'branch-pr'
              || 'working-dir'
            }}
